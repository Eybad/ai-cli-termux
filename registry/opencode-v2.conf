# shellcheck shell=bash
# shellcheck disable=SC2034
APP_NAME="opencode-v2"
DISPLAY_NAME="OpenCode v2"
DESCRIPTION="OpenCode v2: agente de código para terminal"
REPO="anomalyco/opencode"
RELEASE_SOURCE="github"
ARCHIVE_TEMPLATE="opencode-linux-{ARCH}.tar.gz"
CHECKSUM_ALGO="sha256"
CHECKSUM_SOURCE="release_digest"
ELF_NAME="opencode"
NEEDS_PATCHELF=false
EXEC_DIRECT=false
RUNTIME_SETUP="existing"
VERSION_MAJOR="2"
RELEASE_CHANNEL="stable"
RELEASE_POLICY_FILE="registry/releases/opencode-v2.json"
DOWNLOAD_MAX_TIME=600
WRAPPER_RUNNER="opencode-v2-runtime.sh"
WRAPPER_ENV="XDG_CONFIG_HOME=$HOME/.local/share/ai-cli-termux/opencode-v2/config
XDG_DATA_HOME=$HOME/.local/share/ai-cli-termux/opencode-v2/data
XDG_CACHE_HOME=$HOME/.local/share/ai-cli-termux/opencode-v2/cache
XDG_STATE_HOME=$HOME/.local/share/ai-cli-termux/opencode-v2/state
OPENCODE_DB=$HOME/.local/share/ai-cli-termux/opencode-v2/data/opencode-v2.db
OPENCODE_DISABLE_PROJECT_CONFIG=1
OPENCODE_PURE=1
OPENCODE_DISABLE_DEFAULT_PLUGINS=1
OPENCODE_DISABLE_EXTERNAL_SKILLS=1
OPENCODE_DISABLE_CLAUDE_CODE=1
TMPDIR=$HOME/.local/share/ai-cli-termux/opencode-v2/tmp"
WRAPPER_UNSET_ENV="OPENCODE_CONFIG
OPENCODE_CONFIG_DIR
OPENCODE_CONFIG_CONTENT
OPENCODE_CLI_CONFIG_CONTENT
OPENCODE_TUI_CONFIG
OPENCODE_PERMISSION
OPENCODE_SERVER
OPENCODE_SERVER_PASSWORD
OPENCODE_PASSWORD
OPENCODE_CONFIG_PROJECT_DISABLE"

pre_wrapper_hook() {
  local runtime_source="$SCRIPT_DIR/registry/lib/opencode-v2-runtime.sh"
  local runtime_target="$LIBEXEC_DIR/$WRAPPER_RUNNER"

  if [[ ! -f "$runtime_source" || -L "$runtime_source" ]]; then
    printf 'ERROR: falta el runner fuente regular de OpenCode v2.\n' >&2
    return 1
  fi
  if [[ -e "$runtime_target" || -L "$runtime_target" ]]; then
    printf 'ERROR: el bundle ya contiene la ruta reservada del runner.\n' >&2
    return 1
  fi
  cp "$runtime_source" "$runtime_target" || return 1
  chmod 755 "$runtime_target"
}

install_transaction_hook() {
  case "$1" in
    prepare|validate|commit|rollback) ;;
    *)
      printf 'ERROR: fase transaccional inválida para OpenCode v2.\n' >&2
      return 2
      ;;
  esac

  local runtime_source="$SCRIPT_DIR/registry/lib/opencode-v2-runtime.sh"
  if [[ ! -f "$runtime_source" || -L "$runtime_source" ]]; then
    printf 'ERROR: falta el runtime transaccional regular de OpenCode v2.\n' >&2
    return 1
  fi
  # shellcheck disable=SC1090
  . "$runtime_source"
  opencode_v2_runtime_project_root=$SCRIPT_DIR
  opencode_v2_runtime_transaction "$1"
}
