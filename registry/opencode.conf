# registry/opencode.conf
# Configuración del instalador genérico para OpenCode (anomalyco/opencode)
#
# Distribución: GitHub Releases
# Formato:      tarball gzip con un único ELF aarch64 llamado "opencode"
# Verificación: SHA256 del tarball (fail-closed) + release attestation de GitHub
# Notas:        patchelf requerido (binario glibc sobre Termux bionic)

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="opencode"             # Nombre del binario dentro del tarball y del wrapper
DISPLAY_NAME="OpenCode"         # Nombre legible para mensajes
REPO="anomalyco/opencode"       # Repositorio GitHub (usuario/repo)

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: GitHub Releases API
RELEASE_SOURCE="github"

# Nombre del asset a descargar. Puede contener {VERSION} y {ARCH} como
# variables que el instalador expande en tiempo de ejecución.
# ARCH se resuelve a: arm64 (aarch64), amd64 (x86_64)
ARCHIVE_TEMPLATE="opencode-linux-{ARCH}.tar.gz"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha256"          # "sha256" o "sha512"
CHECKSUM_SOURCE="hashfile"      # "hashfile" = leer de sha256.txt; "manifest" = leer de un JSON remoto

# Predicate type para la attestation de GitHub Actions (in-toto)
# Dejar vacío si el proyecto no publica attestations.
ATTEST_PREDICATE="https://in-toto.io/attestation/release/v0.2"

# ── runtime ────────────────────────────────────────────────────────────────────
# Nombre del binario ELF dentro del tarball (puede diferir de APP_NAME)
ELF_NAME="opencode"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
NEEDS_PATCHELF=true

# ── hooks (opcional) ───────────────────────────────────────────────────────────
# Funciones de shell que el instalador llama en puntos específicos del proceso.
# Si no se definen, no pasa nada. Definirlas acá sobrescribe el comportamiento
# por defecto. Las funciones reciben las mismas variables del instalador en scope.

# Llamada justo antes de crear el wrapper.
# Útil para crear configs, directorios, etc.
# pre_wrapper_hook() { : ; }

# Llamada al final del proceso, luego de verify_install().
# post_install_hook() { : ; }
