# shellcheck shell=bash
# shellcheck disable=SC2034

APP_NAME="opencode"
DISPLAY_NAME="OpenCode"
DESCRIPTION="Anomaly OpenCode: AI-assisted terminal coding CLI"
REPO="anomalyco/opencode"
VERSION_MAJOR="2"
RELEASE_CHANNEL="stable"

RELEASE_SOURCE="github"

# Termux amd64 maps to OpenCode's release asset tag "x64".
ARCH_OVERRIDE_X86_64="x64"
ARCHIVE_TEMPLATE="opencode-linux-{ARCH}.tar.gz"
DOWNLOAD_MAX_TIME=600

CHECKSUM_ALGO="sha256"
CHECKSUM_SOURCE="release_digest"

ATTEST_PREDICATE=""

ELF_NAME="opencode"
NEEDS_PATCHELF=false

EXEC_DIRECT=false
WRAPPER_RUNNER="opencode-runner.sh"
WRAPPER_ENV="OPENCODE_DISABLE_AUTOUPDATE=1"

pre_wrapper_hook() {
  source "$SCRIPT_DIR/registry/lib/shims.sh"
  tool_shims_reset
  tool_browser_shims
  tool_clipboard_shims

  local cert_file="${PREFIX:-/data/data/com.termux/files/usr}/etc/tls/cert.pem"
  if [[ -f "$cert_file" && "$WRAPPER_ENV" != *"SSL_CERT_FILE="* ]]; then
    WRAPPER_ENV="${WRAPPER_ENV:+${WRAPPER_ENV}$'\n'}SSL_CERT_FILE=$cert_file"
  fi

  local runner_src="$SCRIPT_DIR/registry/lib/$WRAPPER_RUNNER"
  local runner_dst="$LIBEXEC_DIR/$WRAPPER_RUNNER"
  if [[ ! -f "$runner_src" || -L "$runner_src" ]]; then
    err "Source runner missing or not a regular file: $runner_src"
    exit 1
  fi
  if [[ -e "$runner_dst" || -L "$runner_dst" ]]; then
    err "Runner destination already exists at $runner_dst"
    exit 1
  fi
  cp "$runner_src" "$runner_dst"
  chmod 755 "$runner_dst"
}
