APP_NAME="codex"
DISPLAY_NAME="OpenAI Codex"
DESCRIPTION="OpenAI Codex: agente de programación en el terminal (por voz o comandos)"
REPO="Eybad/ai-cli-termux-dist"

RELEASE_SOURCE="github"
ARCHIVE_TEMPLATE="codex-{ARCH}.tar.gz"

CHECKSUM_ALGO="sha256"
CHECKSUM_SOURCE="release_digest"

ATTEST_PREDICATE="https://slsa.dev/provenance/v1"
ATTEST_REPO="Eybad/ai-cli-termux"

ELF_NAME="codex"
NEEDS_PATCHELF=false
EXEC_DIRECT=true

WRAPPER_DENY_ARGS="update"
# Background daemon auto-start fails on Termux; run TUI in embedded mode by default.
WRAPPER_DEFAULT_ARGS="--disable daemon_auto_start"

pre_wrapper_hook() {
  source "$SCRIPT_DIR/registry/lib/shims.sh"
  tool_shims_reset
  tool_browser_shims
  tool_clipboard_shims
}

post_install_hook() {
  [[ "$ARCH" == "arm64" ]] || return 0

  local version=""
  [[ -f "$LIBEXEC_DIR/manifest.txt" ]] && version=$(sed -n 's/^version=//p' "$LIBEXEC_DIR/manifest.txt" | head -1)
  if [[ -n "$version" ]] \
    && [[ "$(printf '%s' "$version" | awk -F'[.+]' '{print ($1 > 0 || $2 >= 147)}')" == "1" ]] \
    && [[ ! -x "$LIBEXEC_DIR/codex-code-mode-host" ]]; then
    printf '%s\n' \
      "AVISO: falta codex-code-mode-host (code tool de codex $version):" \
      "buscar archivos falla fail-closed. Actualizá con:" \
      "  install.sh codex --update" \
      "para obtener un build con el code mode host." >&2
    return 0
  fi

  local bin="$LIBEXEC_DIR/$ELF_NAME"
  [[ -f "$bin" ]] || return 0
  if ! grep -aqF '__ctype_b_loc' "$bin" 2>/dev/null; then
    return 0
  fi

  # Grep raw bytes because Termux grep does not support Perl-style \xNN.
  local pattern
  pattern=$(printf '\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8')
  if grep -aqF "$pattern" "$bin" 2>/dev/null; then
    return 0
  fi
  printf '%s\n' \
    "AVISO: este build de codex trae el bug de V8 (shim bionic_compat con" \
    "tablas ctype de ceros): al pedir al agente buscar archivos, el code" \
    "tool crashea (trace trap). El chat normal sigue funcionando." \
    "Actualizá con:  install.sh codex --update" \
    "para obtener un build corregido." >&2

  # Fixed builds define aligned symbols locally, appearing once in .symtab instead of twice (dynamic reference).
  local hostbin="$LIBEXEC_DIR/codex-code-mode-host"
  for sym in mprotect madvise; do
    if [[ -f "$hostbin" ]] && grep -aqF "$sym" "$hostbin" 2>/dev/null; then
      local n
      n=$(grep -aoF "$sym" "$hostbin" | wc -l)
      if [[ "$n" -ne 1 ]]; then
        printf '%s\n' \
          "AVISO: este build de codex trae el bug del sandbox de V8 ($sym" \
          "sin alinear): al pedir al agente buscar archivos, el code tool" \
          "crashea (trace trap). Actualizá con:  install.sh codex --update" \
          "para obtener un build corregido." >&2
      fi
    fi
  done
}
