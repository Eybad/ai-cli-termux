# registry/codex.conf
# Configuración del instalador genérico para OpenAI Codex CLI
#
# Distribución: GitHub Releases del repo de distribución Eybad/ai-cli-termux-dist,
# generados por .github/workflows/build-codex.yml (que corre en el repo del
# proyecto). Los assets se compilan en CI desde el código oficial
# (openai/codex, Apache-2.0) para bionic/Android (arm64) y se re-empaquetan
# del asset musl oficial verificado (amd64, host Linux).
# Verificación: SHA256 del asset vía GitHub API (release_digest, fail-closed)
#               + release attestation del workflow de build (emitida por el repo
#               del proyecto, ATTEST_REPO).
# Notas:
#   - El binario oficial de OpenAI es musl estático: en Android no resuelve DNS
#     (lee /etc/resolv.conf de la raíz, inexistente sin proot). Por eso arm64
#     se compila nativo para bionic: DNS (netd) y TLS (rustls/webpki) funcionan.
#   - EXEC_DIRECT=true: el binario corre nativo, sin overlay glibc ni loader.
#   - Sandbox: codex usa landlock por defecto; si el kernel Android no lo
#     soporta, configurar `sandbox_mode = "off"` en ~/.codex/config.toml.

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="codex"                # Nombre del binario dentro del tarball y del wrapper
DISPLAY_NAME="OpenAI Codex"     # Nombre legible para mensajes
DESCRIPTION="OpenAI Codex: agente de programación en el terminal (por voz o comandos)"
# Repo de distribución: solo releases de binarios compilados en CI (tag vX.Y.Z).
REPO="Eybad/ai-cli-termux-dist"

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: GitHub Releases del repo propio (tags estándar vX.Y.Z).
# El workflow detecta el tag upstream (rust-vX.Y.Z de openai/codex) y publica.
RELEASE_SOURCE="github"

# Assets publicados por build-codex.yml con el arch canónico de Termux:
#   codex-arm64.tar.gz (build bionic propio, Android)
#   codex-amd64.tar.gz (asset musl oficial re-empaquetado, Linux host)
# Sin ARCH_OVERRIDE_*: los nombres de asset usan arm64/amd64 directos.
ARCHIVE_TEMPLATE="codex-{ARCH}.tar.gz"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha256"
# "release_digest" = SHA256 del asset publicado por GitHub (API digest, fail-closed).
# Si hay una entrada en sha256.txt para el tag instalado, el pin del repo gana.
CHECKSUM_SOURCE="release_digest"

# Attestation del workflow de build (actions/attest-build-provenance → SLSA v1).
# Se emite al repo donde corre el workflow (el proyecto), no al repo de
# distribución; ATTEST_REPO apunta a ese repo emisor. Requiere gh autenticado
# en el device para verificarla; sin gh se omite.
ATTEST_PREDICATE="https://slsa.dev/provenance/v1"
ATTEST_REPO="Eybad/ai-cli-termux"

# ── runtime ────────────────────────────────────────────────────────────────────
# Nombre del binario ELF dentro del tarball
ELF_NAME="codex"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
NEEDS_PATCHELF=false

# Ejecución directa sin overlay glibc: el binario corre nativo (bionic arm64,
# musl estático amd64). El wrapper hace `exec "$BIN"` sin loader glibc.
# libc++_shared.so (dependencia del build bionic) viaja al lado del binario
# con RUNPATH=$ORIGIN; extract_install copia el directorio completo.
EXEC_DIRECT=true

# codex-code-mode-host (0.147+): el code tool (V8) corre en un binario
# separado que codex busca como "codex-code-mode-host" junto a su propio
# ejecutable ($LIBEXEC_DIR). Viaja como archivo del bundle en el tarball
# (igual que libc++_shared.so): extract_install lo copia solo, sin wrapper en
# $PREFIX/bin ni EXTRA_BINS (que exige NEEDS_PATCHELF=true y patcheo glibc).

# Subcomandos denegados en el wrapper (tokens separados por espacios).
# `codex update` auto-instala releases en $CODEX_HOME por fuera del instalador
# (y además falla con nuestro setup: InstallMethod::Other). Se bloquea en el
# wrapper para que todas las actualizaciones pasen por install.sh --update.
WRAPPER_DENY_ARGS="update"

# ── hooks (mitigaciones Termux) ────────────────────────────────────────────────
pre_wrapper_hook() {
  # ── Mitigación: Intercepción de llamadas a navegadores y clipboards ────────
  # codex usa xdg-open/sensible-browser para el flujo OAuth de login, y
  # xclip/xsel para el portapapeles. glibc-runner crashea silenciosamente si
  # posix_spawn intenta ejecutar un binario que no existe. Shims idempotentes
  # que redirigen a termux-open-url / termux-clipboard-set (mismo patrón que
  # agy.conf; no sobreescriben si ya existen).
  #
  # Los shims creados se registran en $LIBEXEC_DIR/shims.txt para que
  # `install.sh <tool> -u` los elimine (guardia: solo si siguen siendo
  # nuestros shims; un binario real del usuario no se toca).

  local shims_file="$LIBEXEC_DIR/shims.txt"
  : > "$shims_file"
  # Ownership: cada shim lleva un marcador con SU tool (# termux-shim: $APP_NAME).
  # codex y cursor-agent comparten los mismos nombres de navegador: sin el
  # marcador específico, el registro/borrado de un tool pisaría los shims del
  # otro. Un shim con el marcador genérico viejo (pre-ownership) es nuestro:
  # se re-crea con el marcador específico (migración). Solo archivos regulares
  # (un FIFO colgaría el grep).
  local shim_marker="termux-shim: $APP_NAME"

  # Shims de navegadores
  for browser in xdg-open sensible-browser x-www-browser gnome-open kde-open wslview open; do
    local shim="$PREFIX/bin/$browser"
    if [[ -e "$shim" || -L "$shim" ]]; then
      # Re-registrar un shim propio de una corrida anterior: shims.txt se
      # reconstruye en cada corrida (`: >`) y sin el re-registro quedaría
      # incompleto tras un reinstall → el uninstall dejaría shims huérfanos.
      # Solo shims con NUESTRO marcador: un shim del otro tool o un archivo
      # ajeno no se registra ni se toca.
      if [[ -f "$shim" ]] && grep -qF "$shim_marker" "$shim" 2>/dev/null; then
        printf '%s\n' "$browser" >> "$shims_file"
      elif [[ -f "$shim" ]] \
        && ! grep -qE 'termux-shim:' "$shim" 2>/dev/null \
        && grep -qxF '#!/data/data/com.termux/files/usr/bin/bash' "$shim" 2>/dev/null \
        && grep -qxF 'exec termux-open-url "$@"' "$shim" 2>/dev/null; then
        # Marcador viejo (pre-ownership): es exactamente nuestro shim antiguo
        # (shebang + exec, sin marcador ajeno) — migrar al marcador específico.
        printf '#!/data/data/com.termux/files/usr/bin/bash\nexec termux-open-url "$@"\n# %s\n' "$shim_marker" > "$shim"
        chmod 755 "$shim"
        printf '%s\n' "$browser" >> "$shims_file"
      fi
      continue
    fi
    printf '#!/data/data/com.termux/files/usr/bin/bash\nexec termux-open-url "$@"\n# %s\n' "$shim_marker" > "$shim"
    chmod 755 "$shim"
    printf '%s\n' "$browser" >> "$shims_file"
  done

  # Shims de portapapeles (redirigen stdin a termux-clipboard-set o /dev/null)
  for clip in xclip xsel pbcopy wl-copy; do
    local shim="$PREFIX/bin/$clip"
    if [[ -e "$shim" || -L "$shim" ]]; then
      if [[ -f "$shim" ]] && grep -qF "$shim_marker" "$shim" 2>/dev/null; then
        printf '%s\n' "$clip" >> "$shims_file"
      elif [[ -f "$shim" ]] \
        && ! grep -qE 'termux-shim:' "$shim" 2>/dev/null \
        && grep -qxF '#!/data/data/com.termux/files/usr/bin/bash' "$shim" 2>/dev/null \
        && grep -qxF 'if command -v termux-clipboard-set >/dev/null; then exec termux-clipboard-set; else cat > /dev/null; fi' "$shim" 2>/dev/null; then
        # Marcador viejo (pre-ownership): es exactamente nuestro shim antiguo
        # (shebang + exec, sin marcador ajeno) — migrar al marcador específico.
        printf '#!/data/data/com.termux/files/usr/bin/bash\nif command -v termux-clipboard-set >/dev/null; then exec termux-clipboard-set; else cat > /dev/null; fi\n# %s\n' "$shim_marker" > "$shim"
        chmod 755 "$shim"
        printf '%s\n' "$clip" >> "$shims_file"
      fi
      continue
    fi
    printf '#!/data/data/com.termux/files/usr/bin/bash\nif command -v termux-clipboard-set >/dev/null; then exec termux-clipboard-set; else cat > /dev/null; fi\n# %s\n' "$shim_marker" > "$shim"
    chmod 755 "$shim"
    printf '%s\n' "$clip" >> "$shims_file"
  done
}

# ── post_install_hook (detección del bug de V8 en el binario instalado) ───────
# Bug de V8: builds arm64 cuyo shim bionic_compat quedó linkeado con las tablas
# ctype de CEROS (prebuilt glibc de rusty_v8 v149: std::isalnum =
# (*__ctype_b_loc())[c] & _ISalnum devuelve false para todo → CHECK
# IsValidMappingName("v8-sandbox") del sandbox de V8 → SIGTRAP / "trace trap"
# al usar el code tool, ej. buscar archivos). El chat/TUI normal no toca V8
# (se inicializa lazy), por eso no hay smoke test funcional offline.
#
# Detección ESTÁTICA en el binario (determinista, sin red ni key):
#   - shim presente → el ELF define __ctype_b_loc (símbolo en symtab);
#   - bug activo    → shim presente y la tabla glibc real AUSENTE
#     (patrón: 10 × 0xD808 consecutivos = dígitos '0'-'9' de la tabla real;
#     grep -F con bytes, porque el grep -P de Termux no soporta \xNN).
# Builds sin el shim (prebuilt v150.4.0 no referencia los símbolos glibc → el
# .a no se extrae en el link) no tienen el bug. No se usa el tag del manifest:
# +androidN no indica si el build lleva el fix (depende del código del workflow
# con el que se compiló, no del patch_rev).
post_install_hook() {
  [[ "$ARCH" == "arm64" ]] || return 0
  local bin="$LIBEXEC_DIR/$ELF_NAME"
  [[ -f "$bin" ]] || return 0
  if ! grep -aqF '__ctype_b_loc' "$bin" 2>/dev/null; then
    return 0  # sin shim → sin bug
  fi
  local pattern
  pattern=$(printf '\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8')
  if grep -aqF "$pattern" "$bin" 2>/dev/null; then
    return 0  # tabla glibc real presente → fix OK
  fi
  printf '%s\n' \
    "AVISO: este build de codex trae el bug de V8 (shim bionic_compat con" \
    "tablas ctype de ceros): al pedir al agente buscar archivos, el code" \
    "tool crashea (trace trap). El chat normal sigue funcionando." \
    "Actualizá con:  install.sh codex --update" \
    "para obtener un build corregido." >&2
}
