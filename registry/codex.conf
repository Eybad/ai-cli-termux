APP_NAME="codex"
DISPLAY_NAME="OpenAI Codex"
DESCRIPTION="OpenAI Codex: terminal coding agent (voice or commands)"
REPO="Eybad/ai-cli-termux-dist"

RELEASE_SOURCE="github"
ARCHIVE_TEMPLATE="codex-{ARCH}.tar.gz"

CHECKSUM_ALGO="sha256"
CHECKSUM_SOURCE="release_digest"

ATTEST_PREDICATE="https://slsa.dev/provenance/v1"
ATTEST_REPO="Eybad/ai-cli-termux"

ELF_NAME="codex"
NEEDS_PATCHELF=false
EXEC_DIRECT=true

WRAPPER_DENY_ARGS="update"
# Background daemon auto-start fails on Termux; run TUI in embedded mode by default.
WRAPPER_DEFAULT_ARGS="--disable daemon_auto_start"

pre_wrapper_hook() {
  source "$SCRIPT_DIR/registry/lib/shims.sh"
  tool_shims_reset
  tool_browser_shims
  tool_clipboard_shims
}

post_install_hook() {
  [[ "$ARCH" == "arm64" ]] || return 0

  local version=""
  [[ -f "$LIBEXEC_DIR/manifest.txt" ]] && version=$(sed -n 's/^version=//p' "$LIBEXEC_DIR/manifest.txt" | head -1)
  if [[ -n "$version" ]] \
    && [[ "$(printf '%s' "$version" | awk -F'[.+]' '{print ($1 > 0 || $2 >= 147)}')" == "1" ]] \
    && [[ ! -x "$LIBEXEC_DIR/codex-code-mode-host" ]]; then
    printf '%s\n' \
      "WARNING: codex-code-mode-host missing (code tool for codex $version):" \
      "file search will fail-closed. Update using:" \
      "  install.sh codex --update" \
      "to obtain a build with the code mode host." >&2
    return 0
  fi

  local bin="$LIBEXEC_DIR/$ELF_NAME"
  local hostbin="$LIBEXEC_DIR/codex-code-mode-host"
  # Both binaries link the same bionic_compat shim; prefer scanning the smaller host binary when it embeds __ctype_b_loc.
  local ctype_target=""
  if [[ -f "$hostbin" ]] && grep -aqF '__ctype_b_loc' "$hostbin" 2>/dev/null; then
    ctype_target="$hostbin"
  elif [[ -f "$bin" ]] && grep -aqF '__ctype_b_loc' "$bin" 2>/dev/null; then
    ctype_target="$bin"
  fi

  if [[ -n "$ctype_target" ]]; then
    # Grep raw bytes because Termux grep does not support Perl-style \xNN.
    local pattern
    pattern=$(printf '\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8\x08\xd8')
    if ! grep -aqF "$pattern" "$ctype_target" 2>/dev/null; then
      printf '%s\n' \
        "WARNING: this codex build contains the V8 bug (zeroed ctype tables in" \
        "bionic_compat shim): file search will crash (trace trap). Normal chat" \
        "continues to function. Update using:  install.sh codex --update" \
        "to obtain a fixed build." >&2
    fi
  fi

  # Fixed builds define aligned symbols locally, appearing once in .symtab instead of twice (dynamic reference).
  if [[ -f "$hostbin" ]]; then
    local sym n
    for sym in mprotect madvise; do
      n=$( (grep -aoF "$sym" "$hostbin" 2>/dev/null || true) | wc -l)
      if [[ "$n" -gt 1 ]]; then
        printf '%s\n' \
          "WARNING: this codex build contains the V8 sandbox bug (unaligned" \
          "$sym): file search will crash (trace trap). Update using:" \
          "  install.sh codex --update" \
          "to obtain a fixed build." >&2
      fi
    done
  fi
}
