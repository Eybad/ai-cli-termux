# registry/kiro-cli.conf
# Configuración del instalador genérico para Kiro CLI (Amazon)
#
# Distribución: CDN de Amazon (prod.download.cli.kiro.dev)
# Formato:      tarball gzip (kirocli-{ARCH}-linux.tar.gz) con un ELF "kiro-cli"
# Verificación: SHA256 desde el manifest.json oficial del CDN (fail-closed)
# Notas:        patchelf requerido (binario glibc sobre Termux bionic)

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="kiro-cli"             # Nombre del wrapper expuesto al usuario
DISPLAY_NAME="Kiro CLI"         # Nombre legible para mensajes

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: manifest JSON del CDN de Amazon (stable/latest).
# El manifest expone la versión actual y el SHA256 por paquete, por lo que
# la instalación default obtiene SIEMPRE la última versión sin tocar sha256.txt.
RELEASE_SOURCE="manifest_json"

# URL del manifest que provee version y checksum del paquete. {ARCH} se expande.
MANIFEST_URL="https://prod.download.cli.kiro.dev/stable/latest/manifest.json"

# Overrides de arquitectura: el CDN usa "aarch64"/"x86_64" en vez del canónico
# Termux ("arm64"/"amd64"). Aplican tanto al filtro del manifest como al template.
ARCH_OVERRIDE_AARCH64="aarch64"
ARCH_OVERRIDE_X86_64="x86_64"

# Claves JSON del manifest: pueden ser nombres de campo o filtros jq completos.
# El manifest de kiro anida los paquetes en "packages[]"; el filtro selecciona
# el tarball GNU de esta arquitectura por nombre de archivo.
# {ARCH} se expande con ARCH_OVERRIDE_* (aarch64 / x86_64, nombres del CDN).
MANIFEST_KEY_VERSION=".version"
MANIFEST_KEY_URL=""
MANIFEST_KEY_CHECKSUM=".packages[] | select(.download | endswith(\"kirocli-{ARCH}-linux.tar.gz\")) | .sha256"

# Template de URL de descarga. El path del manifest ("2.16.0/kirocli-...") no es
# descargable directo en el CDN (403); la URL "latest" estable SIEMPRE sirve el
# paquete más nuevo, que es justamente el que el manifest referencia.
DOWNLOAD_URL_TEMPLATE="https://prod.download.cli.kiro.dev/stable/latest/kirocli-{ARCH}-linux.tar.gz"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha256"          # "sha256" o "sha512"
CHECKSUM_SOURCE="manifest"      # "hashfile", "manifest" o "release_digest"

# Sin attestation de GitHub para este proyecto
ATTEST_PREDICATE=""

# ── runtime ────────────────────────────────────────────────────────────────────
# Nombre del binario ELF dentro del tarball
ELF_NAME="kiro-cli"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
NEEDS_PATCHELF=true

# Variables de entorno para el wrapper
# SSL_CERT_FILE: necesario para que el binario Go/Rust encuentre los CA de Termux
WRAPPER_ENV="SSL_CERT_FILE=/data/data/com.termux/files/usr/etc/tls/cert.pem"

# ── hooks (opcional) ───────────────────────────────────────────────────────────
# Kiro CLI usa OAuth/SSO (AWS Builder ID). Si hay problemas de autenticación
# o DNS, agregar:
#   GODEBUG=netdns=cgo
# y shims de navegador (ver agy.conf: pre_wrapper_hook).
