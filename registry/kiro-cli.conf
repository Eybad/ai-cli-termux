# registry/kiro-cli.conf
# Configuración del instalador genérico para Kiro CLI (Amazon)
#
# Distribución: CDN de Amazon (prod.download.cli.kiro.dev)
# Formato:      tarball gzip (kirocli-{ARCH}-linux.tar.gz) con un ELF "kiro-cli"
# Verificación: SHA256 desde sha256.txt (fail-closed)
# Notas:        patchelf requerido (binario glibc sobre Termux bionic)

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="kiro-cli"             # Nombre del wrapper expuesto al usuario
DISPLAY_NAME="Kiro CLI"         # Nombre legible para mensajes

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: URL template con versión fija
RELEASE_SOURCE="url_template"

# Template de URL de descarga. {VERSION} y {ARCH} se expanden automáticamente.
# ARCH_OVERRIDE_AARCH64 mapea arm64 de Termux a "aarch64" usado por Kiro
ARCH_OVERRIDE_AARCH64="aarch64"
ARCH_OVERRIDE_X86_64="x86_64"
DOWNLOAD_URL_TEMPLATE="https://prod.download.cli.kiro.dev/stable/latest/kirocli-{ARCH}-linux.tar.gz"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha256"          # "sha256" o "sha512"
CHECKSUM_SOURCE="hashfile"      # "hashfile" = leer de sha256.txt

# Sin attestation de GitHub para este proyecto
ATTEST_PREDICATE=""

# ── runtime ────────────────────────────────────────────────────────────────────
# Nombre del binario ELF dentro del tarball
ELF_NAME="kiro-cli"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
NEEDS_PATCHELF=true

# Variables de entorno para el wrapper
# SSL_CERT_FILE: necesario para que el binario Go/Rust encuentre los CA de Termux
WRAPPER_ENV="SSL_CERT_FILE=/data/data/com.termux/files/usr/etc/tls/cert.pem"

# ── hooks (opcional) ───────────────────────────────────────────────────────────
# Kiro CLI usa OAuth/SSO (AWS Builder ID). Si hay problemas de autenticación
# o DNS, agregar:
#   GODEBUG=netdns=cgo
# y shims de navegador (ver agy.conf: pre_wrapper_hook).
