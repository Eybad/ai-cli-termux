# registry/cursor-agent.conf
# Configuración del instalador genérico para Cursor Agent CLI (cursor-agent)
#
# Distribución: CDN propio (downloads.cursor.com/lab/<version>/<os>/<arch>/...)
# Formato:      tarball gzip (agent-cli-package.tar.gz) con bundle node:
#                 node            → ELF glibc patcheado (ELF_NAME, auditado)
#                 cursor-agent    → launcher bash del bundle (ENTRY_POINT)
#                 index.js/chunks → código del CLI
#                 ELFs auxiliares → rg, cursorsandbox, crepectl
# Verificación: SHA256 del tarball pineado a mano en sha256.txt. El vendor no
#               publica checksums ni manifest: versiones = fecha+commit hash
#               (ej: 2026.07.23-e383d2b) y no hay endpoint "latest" público.
# Notas:
#   - Sin GitHub releases ni manifest JSON → RELEASE_SOURCE=url_template.
#   - Actualización: se detecta la versión nueva en el script de install de
#     cursor.com, se pinnea en sha256.txt y se instala con `-v <version>`.
#     `--update` toma la última versión registrada en sha256.txt.
#   - El instalador oficial de Cursor expone "agent" como comando primario;
#     se replica con ALIASES (symlink gestionado por el instalador).
#   - El CLI trae updater propio: WRAPPER_DENY_ARGS="update" bloquea el
#     comando; si llegara a auto-actualizarse de fondo, verify.sh lo detecta
#     (checksum del binario contra el manifest).

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="cursor-agent"         # Nombre del wrapper expuesto al usuario
DISPLAY_NAME="Cursor Agent CLI" # Nombre legible para mensajes
DESCRIPTION="Cursor Agent CLI: agente headless de Cursor para automatización y CI"
REPO=""                         # Sin repo GitHub para la distribución primaria

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: CDN con URL por versión (sin endpoint de última versión).
RELEASE_SOURCE="url_template"
DOWNLOAD_URL_TEMPLATE="https://downloads.cursor.com/lab/{VERSION}/linux/{ARCH}/agent-cli-package.tar.gz"
# El CDN de Cursor usa "x64" para amd64; "arm64" ya es el nombre canónico.
ARCH_OVERRIDE_X86_64="x64"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha256"
CHECKSUM_SOURCE="hashfile"      # pin manual en sha256.txt (fail-closed)

# Sin attestation de GitHub para este proyecto
ATTEST_PREDICATE=""

# ── runtime ────────────────────────────────────────────────────────────────────
# ELF que se patchea y audita: el runtime node embebido del bundle.
ELF_NAME="node"
# ELFs auxiliares del bundle que el CLI invoca por path absoluto del bundle
# (join(dirname(index.js), <bin>)): necesitan patcheo o su execve falla (el
# interp /lib/ld-linux-aarch64.so.1 no existe en bionic). Se registran como
# EXTRA_BINS para que el pipeline los patchee y audite; los wrappers públicos
# que el modelo crea para ellos son inofensivos (nombres específicos del bundle).
# NOTA: "rg" NO va acá — el vendor lo resuelve por PATH del sistema
# (source: "path-lookup", mensaje oficial: "Please install ripgrep"), así que se
# usa el rg de Termux (pkg install ripgrep) y no se shadowea con el del bundle.
EXTRA_BINS="cursorsandbox crepectl"
# El CLI se lanza vía el launcher bash del bundle (resuelve su dir por $0).
ENTRY_POINT="cursor-agent"
# Comando primario oficial: el instalador de Cursor instala ambos nombres.
ALIASES="agent"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
NEEDS_PATCHELF=true

# ── entorno extra ──────────────────────────────────────────────────────────────
# TLS: node con los certs de Termux (el --use-system-ca del vendor falla en
# Android y su fallback hereda esta variable del wrapper).
# SSL_CERT_DIR: el launcher del bundle siempre corre `node --use-system-ca`
# (su self-test da rc=0 en Termux) y OpenSSL intenta abrir el dir de CA del
# sistema /etc/ssl/certs, inexistente en Android → warning cosmético en stderr
# al arrancar el TUI. Apuntar SSL_CERT_DIR a un dir existente (creado por el
# hook en $LIBEXEC_DIR/tls-certs, vacío) silencia el warning; los certs reales
# los sigue proveyendo SSL_CERT_FILE.
WRAPPER_ENV="SSL_CERT_FILE=/data/data/com.termux/files/usr/etc/tls/cert.pem
SSL_CERT_DIR=/data/data/com.termux/files/usr/libexec/cursor-agent/tls-certs"

# El updater interno del CLI descargaría versiones nuevas sin el fail-closed
# del instalador (sin verificación de checksum): se bloquea el comando.
WRAPPER_DENY_ARGS="update"

# ── hooks (mitigaciones Termux) ────────────────────────────────────────────────
pre_wrapper_hook() {
  # ── Mitigación 1: Shims de navegadores ─────────────────────────────────────
  # El flujo de login OAuth del CLI abre el navegador vía xdg-open o
  # sensible-browser; sin proot no existen. Se redirigen a termux-open-url
  # (mismo patrón que codex.conf). Cada shim creado se registra en
  # $LIBEXEC_DIR/shims.txt para que install.sh los limpie en uninstall
  # (con guardia: solo si siguen siendo nuestros shims). Fail-closed: si el
  # nombre ya existe (ejecutable o no, incluso un symlink colgante), no se
  # pisa — podría ser un archivo del usuario o de otro paquete.
  # Ownership: cada shim lleva un marcador con SU tool (# termux-shim: $APP_NAME).
  # cursor-agent y codex comparten los mismos nombres de navegador: sin el
  # marcador específico, el registro/borrado de un tool pisaría los shims del
  # otro (reinstall → shims.txt incompleto; uninstall → shims ajenos borrados).
  # Un shim con el marcador genérico viejo (pre-ownership) es nuestro: se
  # re-crea con el marcador específico (migración). Solo archivos regulares
  # (un FIFO colgaría el grep).
  local shims_file="$LIBEXEC_DIR/shims.txt"
  : > "$shims_file"
  local shim_marker="termux-shim: $APP_NAME"
  for browser in xdg-open sensible-browser x-www-browser gnome-open kde-open wslview open; do
    local shim="$PREFIX/bin/$browser"
    if [[ -e "$shim" || -L "$shim" ]]; then
      # Re-registrar un shim propio de una corrida anterior: shims.txt se
      # reconstruye en cada corrida (`: >`) y sin el re-registro quedaría
      # incompleto tras un reinstall → el uninstall dejaría shims huérfanos.
      # Solo shims con NUESTRO marcador: un shim del otro tool o un archivo
      # ajeno no se registra ni se toca.
      if [[ -f "$shim" ]] && grep -qF "$shim_marker" "$shim" 2>/dev/null; then
        printf '%s\n' "$browser" >> "$shims_file"
      elif [[ -f "$shim" ]] \
        && ! grep -qE 'termux-shim:' "$shim" 2>/dev/null \
        && grep -qxF '#!/data/data/com.termux/files/usr/bin/bash' "$shim" 2>/dev/null \
        && grep -qxF 'exec termux-open-url "$@"' "$shim" 2>/dev/null; then
        # Marcador viejo (pre-ownership): es exactamente nuestro shim antiguo
        # (shebang + exec, sin marcador ajeno) — migrar al marcador específico.
        printf '#!/data/data/com.termux/files/usr/bin/bash\nexec termux-open-url "$@"\n# %s\n' "$shim_marker" > "$shim"
        chmod 755 "$shim"
        printf '%s\n' "$browser" >> "$shims_file"
      fi
      continue
    fi
    printf '#!/data/data/com.termux/files/usr/bin/bash\nexec termux-open-url "$@"\n# %s\n' "$shim_marker" > "$shim"
    chmod 755 "$shim"
    printf '%s\n' "$browser" >> "$shims_file"
  done

  # ── Mitigación 2: Configurar DNS resolv.conf para glibc ───────────────────
  # glibc requiere un resolv.conf válido en $GLIBC_PREFIX/etc/resolv.conf;
  # sin proot, Android no tiene /etc/resolv.conf global (mismo patrón que
  # agy.conf: copia el de Termux o arma desde getprop con fallback).
  local glibc_resolv="$GLIBC_PREFIX/etc/resolv.conf"
  mkdir -p "$(dirname "$glibc_resolv")"
  if [[ ! -s "$glibc_resolv" ]]; then
    if [[ -s "$PREFIX/etc/resolv.conf" ]]; then
      cp -f "$PREFIX/etc/resolv.conf" "$glibc_resolv"
    else
      local getprop_cmd; getprop_cmd=$(command -v getprop || echo /system/bin/getprop)
      local dns1 dns2
      dns1=$("$getprop_cmd" net.dns1 2>/dev/null || true)
      dns2=$("$getprop_cmd" net.dns2 2>/dev/null || true)
      {
        [[ -n "$dns1" ]] && printf 'nameserver %s\n' "$dns1"
        [[ -n "$dns2" ]] && printf 'nameserver %s\n' "$dns2"
        printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n'
      } | awk '!seen[$0]++' > "$glibc_resolv"
    fi
    info "Resolv.conf de glibc configurado en $glibc_resolv"
  fi

  # ── Mitigación 3: Shebang de los launchers del bundle ─────────────────────
  # El vendor escribe shebangs de Linux desktop ("#!/usr/bin/env bash" y
  # "#!/bin/sh") que no existen en Android: el kernel falla con "bad
  # interpreter". Se reescriben a bash de Termux (bash corre sh-isms sin
  # problema). Aplica a los launchers que el CLI ejecuta directo o como
  # subproceso (askpass del login, svc del runtime).
  local launcher
  for launcher in cursor-agent cursor-agent-svc cursor-askpass; do
    local lf="$LIBEXEC_DIR/$launcher"
    if [[ -f "$lf" ]]; then
      sed -i '1s|^#!.*|#!/data/data/com.termux/files/usr/bin/bash|' "$lf"
      chmod 755 "$lf"
      info "Shebang de $launcher reescrito a bash de Termux"
    fi
  done

  # ── Mitigación 4: Dir de CA para --use-system-ca ─────────────────────────
  # Crea el dir al que apunta SSL_CERT_DIR (WRAPPER_ENV): OpenSSL solo emite
  # el warning de /etc/ssl/certs si el dir NO existe. Se mantiene vacío (los
  # certs vienen de SSL_CERT_FILE); vive en $LIBEXEC_DIR para que el uninstall
  # lo limpie junto con el resto del tool.
  mkdir -p "$LIBEXEC_DIR/tls-certs"
}
