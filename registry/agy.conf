# registry/agy.conf
# Configuración del instalador genérico para Antigravity CLI (agy)
#
# Distribución: Google Cloud Storage vía endpoint de auto-updater
# Formato:      tarball gzip (cli_linux_arm64.tar.gz) con binario "antigravity"
# Verificación: SHA512 del tarball extraído del manifest JSON remoto
# Notas:
#   - No usa GitHub Releases; el manifest lo provee el auto-updater de Google.
#   - El binario interno se llama "antigravity"; el wrapper se expone como "agy".
#   - No hay release attestation de GitHub (sin ATTEST_PREDICATE).
#   - patchelf requerido (binario glibc sobre Termux bionic).
#   - Requiere parche VA39 para Android (TCMalloc 48→39 bit + faccessat2).

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="agy"                  # Nombre del wrapper expuesto al usuario
DISPLAY_NAME="Antigravity CLI"  # Nombre legible para mensajes
REPO=""                         # Sin repo GitHub para la distribución primaria

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: manifest JSON de Google Cloud
RELEASE_SOURCE="manifest_json"

# URL del manifest JSON que provee version, url y checksum del binario.
# Puede contener {ARCH} (arm64 / amd64) y {PLATFORM} (linux_arm64, linux_amd64).
MANIFEST_URL="https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_{ARCH}.json"

# Claves JSON del manifest (para el parser POSIX del instalador)
MANIFEST_KEY_VERSION="version"
MANIFEST_KEY_URL="url"
MANIFEST_KEY_CHECKSUM="sha512"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha512"          # "sha256" o "sha512"
CHECKSUM_SOURCE="manifest"      # "hashfile" o "manifest"

# Sin attestation de GitHub para este proyecto
ATTEST_PREDICATE=""

# ── runtime ────────────────────────────────────────────────────────────────────
# Nombre del binario ELF dentro del tarball (puede diferir de APP_NAME)
ELF_NAME="antigravity"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
NEEDS_PATCHELF=true

# ── entorno extra ──────────────────────────────────────────────────────────────
# Go en Termux sobre glibc debe usar el resolver de glibc (getaddrinfo)
# con un resolv.conf válido y los certs TLS de Termux.
WRAPPER_ENV="SSL_CERT_FILE=/data/data/com.termux/files/usr/etc/tls/cert.pem
GODEBUG=netdns=cgo"

# ── hooks (mitigaciones Termux) ─────────────────────────────────────────────────
pre_wrapper_hook() {
  # ── Mitigación 1: Parche VA39 (TCMalloc + faccessat2) ──────────────────────
  # El binario oficial de Google asume VA48 y usa faccessat2, ambos
  # incompatibles con Android nativo. Parcheamos el binario directamente.
  #
  # Análisis técnico: https://github.com/google-antigravity/antigravity-cli/issues/64
  # Script auditable: registry/patch_va39.py (no descarga nada, no toca la red)
  local patch_script="$SCRIPT_DIR/registry/patch_va39.py"
  if [[ -f "$patch_script" ]] && command -v python3 >/dev/null 2>&1; then
    info "Aplicando parche VA39 (TCMalloc 48→39 bit + faccessat2→faccessat)..."
    local patched_bin="${BIN_FILE}.va39"
    if python3 "$patch_script" "$BIN_FILE" "$patched_bin" 2>&1; then
      # Reemplazar el binario original con el parcheado
      mv -f "$patched_bin" "$BIN_FILE"
      chmod 755 "$BIN_FILE"
      # Recalcular el hash post-parche para el manifest de integridad
      BIN_CHECKSUM_PATCHED=$(checksum_of "$BIN_FILE")
      info "Parche VA39 aplicado. Nuevo hash: ${BIN_CHECKSUM_PATCHED:0:16}..."
    else
      err "El parche VA39 falló. El binario puede no funcionar en este dispositivo."
      err "Revisá la salida de python3 $patch_script"
      # No abortamos: el binario sin parche podría funcionar en dispositivos VA48
      rm -f "$patched_bin"
    fi
  else
    if ! command -v python3 >/dev/null 2>&1; then
      warn "python3 no disponible: no se puede aplicar el parche VA39."
      warn "Instalá con: pkg install python"
      warn "Sin el parche, agy probablemente falle con SIGSYS en Android."
    fi
  fi

  # ── Mitigación 2: Shim libc.so ─────────────────────────────────────────────
  # La glibc de Termux tiene un libc.so que es un linker script ASCII, no un
  # ELF. Cuando el loader glibc intenta cargarlo dinámicamente, falla con
  # "invalid ELF header". Creamos un directorio con symlinks al ELF real.
  local shim_dir="$LIBEXEC_DIR/glibc-shim"
  local real_libc="$GLIBC_PREFIX/lib/libc.so.6"
  if [[ -f "$real_libc" ]]; then
    mkdir -p "$shim_dir"
    ln -sfn "$real_libc" "$shim_dir/libc.so"
    ln -sfn "$real_libc" "$shim_dir/libc.so.6"
    info "Shim libc.so creado en $shim_dir"
  fi

  # ── Mitigación 3: Intercepción de llamadas a navegadores y clipboards ──────
  # agy utiliza xdg-open/sensible-browser para el flujo OAuth, y xclip/xsel
  # para el portapapeles. glibc-runner tiene un bug crítico: si posix_spawn
  # intenta ejecutar un binario que no existe, crashea silenciosamente.
  # Creamos shims falsos para los comandos que agy podría intentar llamar.

  # Shims de navegadores
  for browser in xdg-open sensible-browser x-www-browser gnome-open kde-open wslview open; do
    local shim="$PREFIX/bin/$browser"
    if [[ ! -x "$shim" ]]; then
      printf '#!/data/data/com.termux/files/usr/bin/bash\nexec termux-open-url "$@"\n' > "$shim"
      chmod 755 "$shim"
    fi
  done

  # Shims de portapapeles (redirigen stdin a termux-clipboard-set o /dev/null)
  for clip in xclip xsel pbcopy wl-copy; do
    local shim="$PREFIX/bin/$clip"
    if [[ ! -x "$shim" ]]; then
      printf '#!/data/data/com.termux/files/usr/bin/bash\nif command -v termux-clipboard-set >/dev/null; then exec termux-clipboard-set; else cat > /dev/null; fi\n' > "$shim"
      chmod 755 "$shim"
    fi
  done

  # ── Mitigación 4: LD_LIBRARY_PATH para el shim de libc.so ─────────────────
  # El wrapper limpia LD_LIBRARY_PATH heredado (correcto), pero necesitamos
  # re-setearlo apuntando al shim dir + las libs glibc reales.
  local shim_dir="$LIBEXEC_DIR/glibc-shim"
  WRAPPER_ENV="${WRAPPER_ENV}
LD_LIBRARY_PATH=${shim_dir}:${RPATH}"

  # ── Mitigación 5: Configurar DNS resolv.conf para glibc ───────────────────
  # glibc requiere un resolv.conf válido en $GLIBC_PREFIX/etc/resolv.conf.
  # Sin proot, Android no tiene /etc/resolv.conf global, por lo que glibc
  # no puede resolver dominios (ej. oauth2.googleapis.com) a menos que
  # se cree este archivo explícitamente.
  local glibc_resolv="$GLIBC_PREFIX/etc/resolv.conf"
  mkdir -p "$(dirname "$glibc_resolv")"
  if [[ ! -s "$glibc_resolv" ]]; then
    if [[ -s "$PREFIX/etc/resolv.conf" ]]; then
      cp -f "$PREFIX/etc/resolv.conf" "$glibc_resolv"
    else
      local dns1 dns2
      dns1=$(getprop net.dns1 2>/dev/null || true)
      dns2=$(getprop net.dns2 2>/dev/null || true)
      {
        [[ -n "$dns1" ]] && printf 'nameserver %s\n' "$dns1"
        [[ -n "$dns2" ]] && printf 'nameserver %s\n' "$dns2"
        printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n'
      } | awk '!seen[$0]++' > "$glibc_resolv"
    fi
    info "Resolv.conf de glibc configurado en $glibc_resolv"
  fi
}
