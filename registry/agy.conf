APP_NAME="agy"
DISPLAY_NAME="Antigravity CLI"
DESCRIPTION="Google Antigravity CLI: AI coding assistant (code, docs, and agents)"
REPO=""

RELEASE_SOURCE="manifest_json"

# Google only publishes an Android manifest for arm64; x86_64 falls back to Linux.
MANIFEST_URL="https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_{ARCH}.json"
MANIFEST_URL_AARCH64="https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/android_arm64.json"

MANIFEST_KEY_VERSION=".version"
MANIFEST_KEY_URL=".url"
MANIFEST_KEY_CHECKSUM=".sha512"

CHECKSUM_ALGO="sha512"
CHECKSUM_SOURCE="manifest"

ATTEST_PREDICATE=""

ELF_NAME="antigravity"

NEEDS_PATCHELF=false

EXEC_DIRECT=true

# Upstream #1046: vendor requires exact 'true' (not '1'). Disables background updater that overwrites the verified binary.
WRAPPER_ENV="AGY_CLI_DISABLE_AUTO_UPDATE=true"

WRAPPER_DENY_ARGS="update"

pre_wrapper_hook() {
  source "$SCRIPT_DIR/registry/lib/shims.sh"
  tool_shims_reset
  tool_browser_shims
  tool_clipboard_shims
}
