# registry/agy.conf
# Configuración del instalador genérico para Antigravity CLI (agy)
#
# Distribución: Google Cloud Storage vía endpoint de auto-updater
# Formato:      tarball gzip (cli_android_arm64.tar.gz en Android arm64,
#               cli_linux_<arch>.tar.gz en el resto) con binario "antigravity"
# Verificación: SHA512 del tarball extraído del manifest JSON remoto
# Notas:
#   - No usa GitHub Releases; el manifest lo provee el auto-updater de Google.
#   - El binario interno se llama "antigravity"; el wrapper se expone como "agy".
#   - No hay release attestation de GitHub (sin ATTEST_PREDICATE).
#   - Binario nativo bionic en Android (EXEC_DIRECT, sin overlay glibc ni
#     patchelf): el manifest de Android solo existe en arm64, por eso el ruteo
#     por arquitectura (MANIFEST_URL_AARCH64) con fallback a linux.

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="agy"                  # Nombre del wrapper expuesto al usuario
DISPLAY_NAME="Antigravity CLI"  # Nombre legible para mensajes
DESCRIPTION="Antigravity CLI de Google: asistente de desarrollo con IA (código, docs y agentes)"
REPO=""                         # Sin repo GitHub para la distribución primaria

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: manifest JSON de Google Cloud
RELEASE_SOURCE="manifest_json"

# URL del manifest JSON que provee version, url y checksum del binario.
# Puede contener {ARCH} (arm64 / amd64) y {PLATFORM} (linux_arm64, linux_amd64).
# Google publica un manifest nativo Android solo para arm64; en x86_64 se usa
# el manifest linux (fallback MANIFEST_URL, host Linux con overlay glibc).
MANIFEST_URL="https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_{ARCH}.json"
MANIFEST_URL_AARCH64="https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/android_arm64.json"

# Claves JSON del manifest (nombres de campo o filtros jq; {ARCH}/{PLATFORM} se expanden)
MANIFEST_KEY_VERSION=".version"
MANIFEST_KEY_URL=".url"
MANIFEST_KEY_CHECKSUM=".sha512"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha512"          # "sha256" o "sha512"
CHECKSUM_SOURCE="manifest"      # "hashfile" o "manifest"

# Sin attestation de GitHub para este proyecto
ATTEST_PREDICATE=""

# ── runtime ────────────────────────────────────────────────────────────────────
# Nombre del binario ELF dentro del tarball (puede diferir de APP_NAME)
ELF_NAME="antigravity"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
# No: el build Android es bionic nativo (interpreter /system/bin/linker64).
NEEDS_PATCHELF=false

# Ejecución directa sin overlay glibc (mismo patrón que codex): el wrapper
# hace `exec "$BIN" "$@"`. Requiere NEEDS_PATCHELF=false.
EXEC_DIRECT=true

# Sin WRAPPER_ENV: en bionic el DNS lo resuelve Android (netd) y el TLS usa
# el store del sistema; las vars Go del overlay glibc sobran.

# ── hooks (mitigaciones Termux) ─────────────────────────────────────────────────
pre_wrapper_hook() {
  # ── Intercepción de llamadas a navegadores y clipboards ───────────────────
  # agy utiliza xdg-open/sensible-browser para el flujo OAuth, y xclip/xsel
  # para el portapapeles: se redirigen a termux-open-url / termux-clipboard-set
  # (no existen en Android). Shims con esquema de ownership compartido
  # (marcador por tool, registro en shims.txt, migración pre-ownership,
  # guardias FIFO-safe): registry/lib/shims.sh.
  # (Mismo patrón que codex: el binario nativo no necesita parche VA39, shim
  # libc.so, RUNPATH ni resolv.conf de glibc.)
  source "$SCRIPT_DIR/registry/lib/shims.sh"
  tool_shims_reset
  tool_browser_shims
  tool_clipboard_shims
}
