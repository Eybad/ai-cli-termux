# registry/copilot.conf
# Configuración del instalador genérico para GitHub Copilot CLI (github/copilot-cli)
#
# Distribución: GitHub Releases
# Formato:      tarball gzip con UN único ELF aarch64 llamado "copilot" (sin
#               node_modules, sin launcher externo, sin subdirectorios)
# Verificación: SHA256 del tarball vía digest de la GitHub API (fail-closed)
# Notas:
#   - El binario es un runtime Node/V8 embebido self-contained (~167 MB). El
#     build es "linux" normal: process.platform se fija en compile-time y
#     reporta "linux", NUNCA "android" — el bug de la ruta npm (npm install -g
#     @github/copilot sobre el Node de Termux) es específico de esa ruta, no
#     aplica acá (issue #3333).
#   - Addons nativos glibc-only (node-pty, runtime.node): con patchelf el
#     proceso entero corre sobre el loader glibc de punta a punta; la mezcla
#     bionic/glibc en un mismo proceso es lo que el upstream declara imposible.
#   - Auto-update deshabilitado por diseño: COPILOT_AUTO_UPDATE=false (docs
#     oficiales: cubre CLI + first-party plugins) + WRAPPER_DENY_ARGS="update".
#     El auto-update descargó el paquete de plataforma equivocada en musl
#     (issue #3696) y aplica updates silenciosos en background (issue #3328);
#     un update fuera del instalador rompería el fail-closed del manifest.

# ── identidad ──────────────────────────────────────────────────────────────────
APP_NAME="copilot"              # Nombre del binario dentro del tarball y del wrapper
DISPLAY_NAME="GitHub Copilot CLI"
DESCRIPTION="GitHub Copilot CLI: asistente de IA de GitHub en el terminal (requiere suscripción Copilot)"
REPO="github/copilot-cli"       # Repositorio GitHub (usuario/repo)

# ── distribución ───────────────────────────────────────────────────────────────
# Fuente de releases: GitHub Releases API
RELEASE_SOURCE="github"

# El vendor usa "arm64"/"x64" para los assets (copilot-linux-arm64.tar.gz),
# no los canónicos de Termux (aarch64/amd64).
ARCH_OVERRIDE_AARCH64="arm64"
ARCH_OVERRIDE_X86_64="x64"
ARCHIVE_TEMPLATE="copilot-linux-{ARCH}.tar.gz"

# ── verificación ───────────────────────────────────────────────────────────────
CHECKSUM_ALGO="sha256"
# "release_digest" = SHA256 del asset publicado por GitHub (API digest, fail-closed).
# Si hay una entrada en sha256.txt para el tag instalado, el pin del repo gana.
CHECKSUM_SOURCE="release_digest"

# El release no publica attestations de GitHub (API de attestations → 404),
# igual que agy/cursor-agent. El fail-closed queda en el digest de la API.
ATTEST_PREDICATE=""

# ── runtime ────────────────────────────────────────────────────────────────────
# Nombre del binario ELF dentro del tarball (puede diferir de APP_NAME)
ELF_NAME="copilot"

# ¿Requiere patchelf para correr sobre el overlay glibc de Termux?
NEEDS_PATCHELF=true

# ── entorno extra ──────────────────────────────────────────────────────────────
# TLS: el runtime Node usa OpenSSL → certs de Termux vía SSL_CERT_FILE.
# Auto-update OFF: el CLI descarga paquetes nuevos a ~/.cache/copilot sin pasar
# por el fail-closed del instalador; la env var es el control oficial (docs).
WRAPPER_ENV="SSL_CERT_FILE=/data/data/com.termux/files/usr/etc/tls/cert.pem
COPILOT_AUTO_UPDATE=false"

# Bloquea el subcomando explícito `copilot update`. `copilot version` también
# consulta updates, pero con COPILOT_AUTO_UPDATE=false no descarga nada.
# Frontera conocida (misma que cursor-agent): el bloqueo vive en el wrapper;
# ejecutar el ELF de libexec directo esquiva la env var y el deny.
WRAPPER_DENY_ARGS="update"

# ── hooks (mitigaciones Termux) ────────────────────────────────────────────────
pre_wrapper_hook() {
  # ── Mitigación 1: Shims de navegadores y portapapeles ──────────────────────
  # El login OAuth device flow abre el navegador (xdg-open/sensible-browser) y
  # puede intentar copiar el código al clipboard (xclip/xsel); sin proot no
  # existen y glibc-runner crashea silenciosamente al posix_spawn un binario
  # inexistente. Mismo esquema que agy: registry/lib/shims.sh.
  source "$SCRIPT_DIR/registry/lib/shims.sh"
  tool_shims_reset
  tool_browser_shims
  tool_clipboard_shims

  # ── Mitigación 2: Configurar DNS resolv.conf para glibc ───────────────────
  # glibc requiere un resolv.conf válido en $GLIBC_PREFIX/etc/resolv.conf.
  # Sin proot, Android no tiene /etc/resolv.conf global, por lo que glibc
  # no puede resolver dominios (ej. api.github.com) a menos que se cree
  # este archivo explícitamente (mismo patrón que agy/cursor-agent).
  local glibc_resolv="$GLIBC_PREFIX/etc/resolv.conf"
  mkdir -p "$(dirname "$glibc_resolv")"
  if [[ ! -s "$glibc_resolv" ]]; then
    if [[ -s "$PREFIX/etc/resolv.conf" ]]; then
      cp -f "$PREFIX/etc/resolv.conf" "$glibc_resolv"
    else
      local getprop_cmd; getprop_cmd=$(command -v getprop || echo /system/bin/getprop)
      local dns1 dns2
      dns1=$("$getprop_cmd" net.dns1 2>/dev/null || true)
      dns2=$("$getprop_cmd" net.dns2 2>/dev/null || true)
      {
        [[ -n "$dns1" ]] && printf 'nameserver %s\n' "$dns1"
        [[ -n "$dns2" ]] && printf 'nameserver %s\n' "$dns2"
        printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\n'
      } | awk '!seen[$0]++' > "$glibc_resolv"
    fi
    info "Resolv.conf de glibc configurado en $glibc_resolv"
  fi
}
