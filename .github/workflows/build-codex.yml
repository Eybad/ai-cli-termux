name: Build codex (bionic arm64 + musl amd64 verificado)

# Pipeline de compilación de OpenAI Codex CLI para Termux, sin depender de
# binarios de terceros:
#
#   arm64 (Android/Termux): build propio desde el código oficial
#       (openai/codex, Apache-2.0) con target aarch64-linux-android (bionic,
#       NDK API 29). Resuelve los dos problemas del asset oficial musl en
#       Android: DNS (bionic → netd) y arranque nativo sin proot.
#   amd64 (host Linux): re-empaque del asset oficial musl VERIFICADO contra el
#       digest SHA256 de la API de openai/codex (fail-closed: si no coincide,
#       no se publica).
#
# Resultado: release de distribución en el repo Eybad/ai-cli-termux-dist (el
# workflow corre en este repo, el publish va al repo de dist con un PAT
# fine-grained — secret DIST_REPO_TOKEN).
#
# Esquema de tags: el tag de dist lleva build metadata semver cuando el build
# de Android aplica el parche de locks (File::lock* no funciona en android,
# rust-lang/rust#148325):
#   - android_patch=true  → vX.Y.Z+androidN  (N = patch_rev, default 1)
#   - android_patch=false → vX.Y.Z           (tag estándar, sin parche)
# El instalador (registry/codex.conf, RELEASE_SOURCE=github + release_digest)
# preserva el +build en versión y tag → `--update` sobrevive a cada release
# nuevo de OpenAI y distingue el release parcheado del estándar.
#
# Idempotente: si el tag de dist (DIST_TAG) ya está publicado, el job de
# chequeo termina sin trabajo. Re-emitir una versión corregida se hace
# incrementando patch_rev (vX.Y.Z+androidN). Historial: +android2 fix de
# locks; +android3 fix de las tablas ctype de V8 (el shim bionic_compat con
# tablas de ceros hacía fallar isalnum del prebuilt glibc → SIGTRAP del
# sandbox de V8 al usar el code tool).
#
# Versión mínima: 0.147 (el code tool corre en codex-code-mode-host, crate y
# asset separados; el build lo compila/re-empaqueta junto al CLI). Un dispatch
# con una versión anterior no tiene crate/asset del host → build aborta
# fail-closed (no se publica nada; la última buena sigue instalable).
#
# Seguridad: valores del upstream validados por charset y normalizados a
# commit SHA inmutable antes de usarse; actions pineadas por SHA; NDK
# verificado contra el checksum oficial de Google; permisos mínimos por job.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión específica de OpenAI Codex (ej: 0.146.0). Vacío = última.'
        required: false
        default: ''
      patch_rev:
        description: 'Rev del parche Android (locks + ctype V8; sufijo +androidN del tag de dist). Incrementar para re-emitir una versión corregida.'
        required: false
        default: '1'
      android_patch:
        description: 'Aplicar el parche Android (locks + ctype V8; tag vX.Y.Z+androidN). false = tag estándar sin parche.'
        required: false
        default: 'true'
  schedule:
    - cron: '17 4 * * *'   # diario 04:17 UTC

env:
  UPSTREAM_REPO: openai/codex
  # Repo de distribución: solo releases de binarios compilados en CI.
  # El GITHUB_TOKEN del workflow solo tiene permisos sobre este repo (el del
  # proyecto); publicar en el dist requiere el secret DIST_REPO_TOKEN (PAT
  # fine-grained con Contents: read/write sobre el dist).
  DIST_REPO: Eybad/ai-cli-termux-dist
  # Checksum MD5 de android-ndk-r26d-linux.zip (668 556 491 bytes).
  # Google re-empaquetó el zip SIN actualizar repository2-1.xml ni el wiki
  # (2026-08): el MD5 real del archivo servido es 3acc3d...; el histórico
  # fcdad75... ya no corresponde. Verificado localmente y desde el runner
  # (2 corridas, redes distintas) contra dl.google.com por TLS.
  NDK_VER: r26d
  NDK_URL: https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
  NDK_MD5: 3acc3d221cb7d7dfb637f801c94b06bb

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      upstream_sha: ${{ steps.resolve.outputs.upstream_sha }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      patch_rev: ${{ steps.resolve.outputs.patch_rev }}
      android_patch: ${{ steps.resolve.outputs.android_patch }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolver versión upstream y estado del release propio
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          # Los inputs de workflow_dispatch NO existen en el evento schedule
          # (se evalúan vacíos): los defaults se resuelven acá, en el script.
          INPUT_PATCH_REV: ${{ inputs.patch_rev }}
          INPUT_ANDROID_PATCH: ${{ inputs.android_patch }}
        run: |
          set -euo pipefail

          # Tag upstream: el release pedido, o el latest (tag_name "rust-vX.Y.Z")
          if [[ -n "${INPUT_VERSION}" ]]; then
            RELEASE_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/tags/rust-v${INPUT_VERSION}")
          else
            RELEASE_JSON=$(gh api "repos/${UPSTREAM_REPO}/releases/latest")
          fi

          UPSTREAM_TAG=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
          # Fail-closed: charset estricto de git ref (evita inyección en shell).
          [[ "$UPSTREAM_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "ERROR: tag upstream inválido: '$UPSTREAM_TAG'"; exit 1; }

          VERSION=$(printf '%s' "$UPSTREAM_TAG" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          [[ -n "$VERSION" ]] || { echo "ERROR: versión no extraída de '$UPSTREAM_TAG'"; exit 1; }

          # target_commitish de la API suele ser un nombre de rama ("main"), no
          # un SHA. Resolver el commit inmutable del tag (puede ser anotado).
          SHA=$(printf '%s' "$RELEASE_JSON" | jq -r '.target_commitish // empty')
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            REF_JSON=$(gh api "repos/${UPSTREAM_REPO}/git/ref/tags/${UPSTREAM_TAG}")
            SHA=$(printf '%s' "$REF_JSON" | jq -r '.object.sha')
            if [[ "$(printf '%s' "$REF_JSON" | jq -r '.object.type')" == "tag" ]]; then
              SHA=$(gh api "repos/${UPSTREAM_REPO}/git/tags/${SHA}" --jq '.object.sha')
            fi
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: SHA del commit no resuelto para $UPSTREAM_TAG"; exit 1; }

          # Tag de distribución: build metadata semver cuando el build de
          # Android aplica el parche (locks + ctype V8; vX.Y.Z+androidN).
          # Defaults para el evento schedule (sin inputs): patch_rev=1,
          # android_patch=true — mismo comportamiento que el dispatch sin
          # valores. Los outputs se propagan a los jobs de build/release.
          PATCH_REV="${INPUT_PATCH_REV:-1}"
          ANDROID_PATCH="${INPUT_ANDROID_PATCH:-true}"
          [[ "$PATCH_REV" =~ ^[0-9]+$ ]] || {
            echo "ERROR: patch_rev inválido: '$PATCH_REV' (solo dígitos)"; exit 1; }
          [[ "$ANDROID_PATCH" =~ ^(true|false)$ ]] || {
            echo "ERROR: android_patch inválido: '$ANDROID_PATCH' (true|false)"; exit 1; }
          if [[ "$ANDROID_PATCH" == "true" ]]; then
            DIST_TAG="v${VERSION}+android${PATCH_REV}"
          else
            DIST_TAG="v${VERSION}"
          fi
          [[ "$DIST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\+android[0-9]+)?$ ]] || {
            echo "ERROR: DIST_TAG inválido: '$DIST_TAG'"; exit 1; }

          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$SHA"          >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG"         >> "$GITHUB_OUTPUT"
          echo "patch_rev=$PATCH_REV"       >> "$GITHUB_OUTPUT"
          echo "android_patch=$ANDROID_PATCH" >> "$GITHUB_OUTPUT"

          # Idempotencia: si el release de distribución ya existe, no rebuildear.
          # Lectura de repo público: no requiere el PAT del dist.
          if gh release view "$DIST_TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            echo "$DIST_TAG ya publicado en $DIST_REPO; nada que hacer."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-arm64:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: '1.96.0'
    steps:
      - name: Checkout código oficial de OpenAI (pin por commit SHA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.upstream_sha }}
          path: upstream

      - name: Checkout del proyecto (generador de parche y tablas ctype, pin por SHA del run)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          path: project

      - name: Aplicar parche de locks Android (generador fail-closed)
        if: needs.check.outputs.android_patch == 'true'
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PATCH_REV: ${{ needs.check.outputs.patch_rev }}
        run: |
          set -euo pipefail
          # El generador valida el inventario de call sites y el core de la
          # versión; cualquier desvío del source upstream aborta el build
          # (fail-closed: no se publica un binario sin el parche aplicado).
          python3 "$GITHUB_WORKSPACE/project/scripts/gen-codex-lock-patch.py" \
            --apply --src "$GITHUB_WORKSPACE/upstream/codex-rs" \
            --dist-version "${VERSION}+android${PATCH_REV}"
          grep -n '^version = ' "$GITHUB_WORKSPACE/upstream/codex-rs/Cargo.toml" | head -2

      - name: Cache cargo (registro + target)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: codex-rs-${{ runner.os }}-${{ hashFiles('upstream/codex-rs/Cargo.lock') }}
          restore-keys: |
            codex-rs-${{ runner.os }}-

      - name: Toolchain Rust (el lock regenerado exige rustc >= 1.96)
        # rust-toolchain.toml del upstream pinnea 1.95.0, pero el Cargo.lock
        # regenerado (desincronizado en el tag upstream) resuelve rama-* 0.3.0,
        # que requiere rustc 1.96.0. Nuestro build controla el toolchain.
        working-directory: upstream/codex-rs
        run: |
          rustup toolchain install ${{ env.RUSTUP_TOOLCHAIN }} --profile minimal --target aarch64-linux-android
          rustc --version && rustup target list --installed

      - name: Descargar NDK oficial de Google y verificar checksum (fail-closed)
        run: |
          set -euo pipefail
          # -w: si el checksum no coincide, el tamaño descargado ayuda a
          # distinguir una descarga truncada de un archivo distinto.
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/ndk.zip" "$NDK_URL" \
            -w 'Descargados: %{size_download} bytes\n'
          GOT=$(md5sum "$RUNNER_TEMP/ndk.zip" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$RUNNER_TEMP/ndk.zip")
          if [[ "$GOT" != "$NDK_MD5" ]]; then
            echo "ERROR: checksum del NDK no coincide: esperado $NDK_MD5, obtenido $GOT (tamaño $SIZE bytes)"
            exit 1
          fi
          echo "Checksum del NDK verificado: $GOT"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-$NDK_VER" >> "$GITHUB_ENV"

      - name: Descargar prebuilt rusty_v8 para aarch64 y verificar digest (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Versión pineada al crate v8 del Cargo.lock upstream (0.147.0 → 150.4.0).
          V8_URL="https://github.com/denoland/rusty_v8/releases/download/v150.4.0/librusty_v8_release_aarch64-unknown-linux-gnu.a.gz"
          # Digest del asset desde la API del release (mismo patrón fail-closed que el job amd64).
          EXPECTED=$(gh api repos/denoland/rusty_v8/releases/tags/v150.4.0 \
            --jq '.assets[] | select(.name == "librusty_v8_release_aarch64-unknown-linux-gnu.a.gz") | .digest' | sed 's/^sha256://')
          [[ -n "$EXPECTED" ]] || { echo "ERROR: digest del prebuilt rusty_v8 no resuelto"; exit 1; }
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/rusty_v8.a.gz" "$V8_URL"
          GOT=$(sha256sum "$RUNNER_TEMP/rusty_v8.a.gz" | cut -d' ' -f1)
          if [[ "$GOT" != "$EXPECTED" ]]; then
            echo "ERROR: digest mismatch del prebuilt rusty_v8: esperado $EXPECTED, obtenido $GOT"
            exit 1
          fi
          echo "Digest del prebuilt rusty_v8 verificado: $GOT"
          gzip -d "$RUNNER_TEMP/rusty_v8.a.gz"
          echo "RUSTY_V8_ARCHIVE=$RUNNER_TEMP/rusty_v8.a" >> "$GITHUB_ENV"
          # v8 busca src_binding_release_aarch64-linux-android.rs en su gen/
          # Copiar el binding aarch64-unknown-linux-gnu (FFI idéntico en aarch64)
          cargo fetch --manifest-path upstream/codex-rs/Cargo.toml
          find ~/.cargo/registry/src/ -path '*/v8-*/gen' -exec sh -c 'cp "$1/src_binding_release_aarch64-unknown-linux-gnu.rs" "$1/src_binding_release_aarch64-linux-android.rs"' _ {} \;

      - name: Crear shim bionic_compat para símbolos glibc de v8
        run: |
          set -euo pipefail
          NDK_TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <stdarg.h>' \
            '#include <wchar.h>' \
            '#include <stdint.h>' \
            '#include <errno.h>' \
            '#include <string.h>' \
            '#include <sys/stat.h>' \
            '#include <sys/syscall.h>' \
            '#include <unistd.h>' \
            '' \
            'void *__libc_stack_end = 0;' \
            'long __timezone = 0;' \
            '' \
            'int backtrace(void **b, int s) { return 0; }' \
            'char **backtrace_symbols(void *const *b, int s) { return 0; }' \
            'void backtrace_symbols_fd(void *const *b, int s, int f) {}' \
            '' \
            'int *__errno_location(void) { return __errno(); }' \
            '' \
            '/* V8 cpu-arm64.cc llama __clear_cache (glibc). Bionic lo expone via' \
            '   cacheflush(2). No podemos redeclararla porque el NDK la trata como' \
            '   builtin con firma (void*,void*). Usamos un wrapper con asm label. */' \
            'void __clear_cache_impl(void *beg, void *end) { __builtin___clear_cache(beg, end); }' \
            '__asm__(".globl __clear_cache\n.set __clear_cache, __clear_cache_impl");' \
            '' \
            'int memfd_create(const char *name, unsigned int flags) {' \
            '  return syscall(__NR_memfd_create, name, flags);' \
            '}' \
            '' \
            '/* glibc stat wrappers: bionic usa fstat/stat directamente */' \
            'int __fxstat64(int ver, int fd, struct stat *buf) { return fstat(fd, buf); }' \
            'int __xstat64(int ver, const char *path, struct stat *buf) { return stat(path, buf); }' \
            '' \
            '/* V8 turboshaft usa bcmp (BSD/glibc); bionic lo tiene desde API 30 */' \
            'int bcmp(const void *s1, const void *s2, size_t n) { return memcmp(s1, s2, n); }' \
            '' \
            'int __vfprintf_chk(FILE *st, int fl, const char *fmt, va_list ap) { return vfprintf(st, fmt, ap); }' \
            'int __isoc99_sscanf(const char *str, const char *fmt, ...) {' \
            '  va_list ap; va_start(ap, fmt); int r = vsscanf(str, fmt, ap); va_end(ap); return r;' \
            '}' \
            'size_t __mbrlen(const char *s, size_t n, mbstate_t *ps) { return mbrlen(s, n, ps); }' \
            > "$RUNNER_TEMP/bionic_compat.c"
          # Tablas ctype glibc REALES (locale C) + funciones __ctype_*_loc,
          # generadas por scripts/gen-ctype-tables.py (determinista, fail-closed).
          # Las tablas de CEROS del shim original rompían std::isalnum del
          # prebuilt glibc de v8 ((*__ctype_b_loc())[c] & _ISalnum): el CHECK
          # IsValidMappingName("v8-sandbox") del init del sandbox de V8 fallaba
          # (SIGTRAP / "trace trap") al usar el code tool (buscar archivos).
          python3 "$GITHUB_WORKSPACE/project/scripts/gen-ctype-tables.py" >> "$RUNNER_TEMP/bionic_compat.c"
          # Fail-closed: el fragmento debe traer las tres funciones y la tabla
          # b con los bits reales de glibc (0xd808 = digit|xdigit|print|graph|
          # alnum para '0', verificado contra locale/C-ctype.c); si el script
          # produjo basura o falló, abortar antes de compilar.
          grep -qi '0xd808' "$RUNNER_TEMP/bionic_compat.c" || {
            echo "ERROR: tablas ctype no generadas (b_tbl sin bits reales)"; exit 1; }
          grep -qE '__ctype_(b|toupper|tolower)_loc\(void\)' "$RUNNER_TEMP/bionic_compat.c" || {
            echo "ERROR: faltan funciones __ctype_*_loc en bionic_compat.c"; exit 1; }
          "$NDK_TC/aarch64-linux-android29-clang" -c "$RUNNER_TEMP/bionic_compat.c" -o "$RUNNER_TEMP/bionic_compat.o"
          "$NDK_TC/llvm-ar" rcs "$RUNNER_TEMP/libbionic_compat.a" "$RUNNER_TEMP/bionic_compat.o"

      - name: Parchear openssl-sys (vendored) para bionic
        # El crate raíz declara openssl-sys = "*" (native-tls) y bionic no trae
        # libssl: sin parche, el cross-build no encuentra OpenSSL para el target.
        # Con vendored en workspace y bajo [dependencies] en cli/Cargo.toml,
        # openssl-src compila OpenSSL estático usando el NDK (ANDROID_NDK_HOME exportado).
        working-directory: upstream/codex-rs
        run: |
          set -euo pipefail
          sed -i 's|^openssl-sys = "\*"|openssl-sys = { version = "*", features = ["vendored"] }|' Cargo.toml
          sed -i '/^\[dependencies\]/a openssl-sys = { workspace = true, features = ["vendored"] }' cli/Cargo.toml
          grep -n 'openssl-sys' Cargo.toml cli/Cargo.toml

      - name: Compilar codex-cli + codex-code-mode-host para aarch64-linux-android (bionic)
        working-directory: upstream/codex-rs
        env:
          ANDROID_NDK_HOME: ${{ runner.temp }}/android-ndk-${{ env.NDK_VER }}
          # Build serial: baja el pico de memoria del build (v8/openssl/rustc
          # en paralelo OOMeaba el runner). Más lento (~2-4x) pero estable.
          CARGO_BUILD_JOBS: 1
        run: |
          set -euo pipefail
          NDK_TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$NDK_TC/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$NDK_TC/llvm-ar"
          export RANLIB_aarch64_linux_android="$NDK_TC/llvm-ranlib"
          export RANLIB="$NDK_TC/llvm-ranlib"
          export PATH="$NDK_TC:$PATH"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_TC/aarch64-linux-android29-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-L native=${{ runner.temp }} -l static=bionic_compat"
          # El Cargo.lock del tag upstream a veces está desincronizado con su
          # Cargo.toml (mantenimiento de openai): actualizar solo openssl-sys para que
          # openssl-src quede registrado sin tocar versiones probadas de otras deps (ej. rama-*).
          cargo update -p openssl-sys
          # El parche de locks bumpó [workspace.package] version (+build): los
          # crates que heredan version.workspace quedaron desincronizados en el
          # lock. Resincronizar solo los miembros del workspace (no toca deps
          # externas); --locked abajo valida que no falte nada.
          cargo update --workspace
          # --locked: falla si el Cargo.lock (ya regenerado) necesita cambios.
          # codex-code-mode-host: desde 0.147 el code tool (V8) corre en un
          # binario separado que codex busca como "codex-code-mode-host" junto
          # a su propio ejecutable; sin él el code tool falla fail-closed.
          cargo build --locked --release -p codex-cli -p codex-code-mode-host --target aarch64-linux-android

      - name: Instalar patchelf (verificación de RUNPATH)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf

      - name: Empaquetar binario + codex-code-mode-host + libc++_shared.so (RUNPATH $ORIGIN)
        run: |
          set -euo pipefail
          BIN=upstream/codex-rs/target/aarch64-linux-android/release/codex
          [[ -f "$BIN" ]] || { echo "ERROR: binario no generado"; exit 1; }

          # Fail-closed: debe ser ELF bionic (dinámico) de aarch64.
          file "$BIN" | grep -qE 'ELF 64-bit.*ARM aarch64' || { file "$BIN"; exit 1; }

          LIB="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          [[ -f "$LIB" ]] || { echo "ERROR: libc++_shared.so no encontrado en NDK"; exit 1; }

          # Code mode host: binario compañero del bundle (0.147+). codex lo
          # busca como "codex-code-mode-host" junto a su propio ejecutable
          # ($LIBEXEC_DIR); el instalador copia el directorio completo del
          # tarball, así que viaja igual que libc++_shared.so, sin wrapper.
          HOST=upstream/codex-rs/target/aarch64-linux-android/release/codex-code-mode-host
          [[ -f "$HOST" ]] || { echo "ERROR: codex-code-mode-host no generado"; exit 1; }
          file "$HOST" | grep -qE 'ELF 64-bit.*ARM aarch64' || { file "$HOST"; exit 1; }

          mkdir -p stage
          cp "$BIN" stage/codex
          cp "$HOST" stage/codex-code-mode-host
          cp "$LIB" stage/libc++_shared.so
          # RUNPATH=$ORIGIN: el loader bionic encuentra libc++_shared.so junto al binario.
          patchelf --set-rpath '$ORIGIN' stage/codex
          patchelf --print-rpath stage/codex | grep -q '\$ORIGIN' || { echo "ERROR: rpath no aplicado"; exit 1; }
          patchelf --set-rpath '$ORIGIN' stage/codex-code-mode-host
          patchelf --print-rpath stage/codex-code-mode-host | grep -q '\$ORIGIN' || { echo "ERROR: rpath del host no aplicado"; exit 1; }
          file stage/codex stage/codex-code-mode-host
          ls -la stage/codex stage/codex-code-mode-host stage/libc++_shared.so

          tar -C stage -czf codex-arm64.tar.gz codex codex-code-mode-host libc++_shared.so
          sha256sum codex-arm64.tar.gz

      - name: Subir artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-arm64
          path: codex-arm64.tar.gz
          if-no-files-found: error

  build-amd64:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UPSTREAM_ASSET: codex-x86_64-unknown-linux-musl.tar.gz
      # Code mode host (0.147+): asset oficial separado; sin él el code tool
      # (V8) falla fail-closed. Se re-empaqueta junto a codex con digest
      # verificado, igual que el binario principal.
      UPSTREAM_HOST_ASSET: codex-code-mode-host-x86_64-unknown-linux-musl.tar.gz
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
    steps:
      - name: Descargar assets oficiales musl (codex + host) y verificar digest (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for SPEC in "$UPSTREAM_ASSET" "$UPSTREAM_HOST_ASSET"; do
            # Digest esperado desde la API del release upstream (sha256 del asset).
            # El nombre va por env.SPEC (jq), sin interpolación de strings.
            EXPECTED=$(SPEC="$SPEC" gh api "repos/${UPSTREAM_REPO}/releases/tags/${UPSTREAM_TAG}" \
              --jq '.assets[] | select(.name == env.SPEC) | .digest' | sed 's/^sha256://')
            [[ -n "$EXPECTED" ]] || { echo "ERROR: asset $SPEC no encontrado upstream"; exit 1; }

            curl -fsSL --proto '=https' --tlsv1.2 -o "$SPEC" \
              "https://github.com/${UPSTREAM_REPO}/releases/download/${UPSTREAM_TAG}/$SPEC"

            GOT=$(sha256sum "$SPEC" | cut -d' ' -f1)
            if [[ "$GOT" != "$EXPECTED" ]]; then
              echo "ERROR: digest mismatch del asset oficial $SPEC: esperado $EXPECTED, obtenido $GOT"
              exit 1
            fi
            echo "Digest verificado ($SPEC): $GOT"
          done

      - name: Re-empaquetar como codex-amd64.tar.gz
        run: |
          set -euo pipefail
          tar -xzf "$UPSTREAM_ASSET"
          tar -xzf "$UPSTREAM_HOST_ASSET"
          # Unicidad: si el tarball cambiara de estructura (más de un binario
          # con el prefijo), abortar en vez de elegir uno al azar (head -1).
          INNER_LIST=$(find . -maxdepth 1 -type f -name 'codex-x86_64-*' ! -name '*.tar.gz')
          [[ "$(printf '%s\n' "$INNER_LIST" | grep -c .)" -eq 1 ]] || { echo "ERROR: número inesperado de binarios codex en el tarball"; exit 1; }
          INNER="$INNER_LIST"
          [[ -n "$INNER" ]] || { echo "ERROR: binario no encontrado en el tarball"; exit 1; }
          file "$INNER" | grep -qE 'ELF 64-bit.*x86-64' || { file "$INNER"; exit 1; }
          HOST_INNER_LIST=$(find . -maxdepth 1 -type f -name 'codex-code-mode-host-*' ! -name '*.tar.gz')
          [[ "$(printf '%s\n' "$HOST_INNER_LIST" | grep -c .)" -eq 1 ]] || { echo "ERROR: número inesperado de codex-code-mode-host en el tarball"; exit 1; }
          HOST_INNER="$HOST_INNER_LIST"
          [[ -n "$HOST_INNER" ]] || { echo "ERROR: codex-code-mode-host no encontrado en el tarball"; exit 1; }
          file "$HOST_INNER" | grep -qE 'ELF 64-bit.*x86-64' || { file "$HOST_INNER"; exit 1; }
          mkdir -p stage
          mv "$INNER" stage/codex
          mv "$HOST_INNER" stage/codex-code-mode-host
          tar -C stage -czf codex-amd64.tar.gz codex codex-code-mode-host
          sha256sum codex-amd64.tar.gz

      - name: Subir artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-amd64
          path: codex-amd64.tar.gz
          if-no-files-found: error

  release:
    needs: [check, build-arm64, build-amd64]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      DIST_TAG: ${{ needs.check.outputs.dist_tag }}
      UPSTREAM_TAG: ${{ needs.check.outputs.upstream_tag }}
      UPSTREAM_SHA: ${{ needs.check.outputs.upstream_sha }}
      ANDROID_PATCH: ${{ needs.check.outputs.android_patch }}
    steps:
      - name: Descargar assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: codex-*
          path: assets
          merge-multiple: true

      - name: Publicar release de distribución (repo ai-cli-termux-dist)
        # GH_TOKEN del workflow no puede escribir en otro repo; se usa el PAT
        # fine-grained del dist (secret DIST_REPO_TOKEN, Contents: read/write).
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd assets
          ls -la
          NOTES_FILE="$RUNNER_TEMP/codex-notes.md"
          # printf evita heredocs con indentación YAML (quedaría como bloque markdown).
          printf '%s\n' \
            "OpenAI Codex ${DIST_TAG#v} — build propio para Termux." \
            "" \
            "- **codex-arm64.tar.gz**: compilado en este workflow desde el código oficial (openai/codex@${UPSTREAM_TAG}, commit ${UPSTREAM_SHA}) con target aarch64-linux-android (bionic, NDK API 29). DNS y TLS nativos; sin proot." \
            "- **codex-amd64.tar.gz**: asset oficial musl de OpenAI, digest SHA256 verificado contra la API upstream (fail-closed). Para host Linux." \
            "" \
            "Instalación: \`bash install.sh codex\` (repo Eybad/ai-cli-termux)." \
            > "$NOTES_FILE"
          if [[ "$ANDROID_PATCH" == "true" ]]; then
            printf '%s\n' \
              "" \
              "**arm64**: incluye el parche Android: file_lock_shim (flock(2); std::fs::File::lock* devuelve Unsupported en android, rust-lang/rust#148325) y las tablas ctype glibc reales para el prebuilt de V8 (fix del SIGTRAP del code tool)." \
              >> "$NOTES_FILE"
          fi
          gh release create "$DIST_TAG" \
            codex-arm64.tar.gz codex-amd64.tar.gz \
            --repo "$DIST_REPO" \
            --title "OpenAI Codex ${DIST_TAG#v}" \
            --notes-file "$NOTES_FILE"
          sha256sum codex-arm64.tar.gz codex-amd64.tar.gz

      - name: Attestation de provenance (SLSA) de ambos assets
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            assets/codex-arm64.tar.gz
            assets/codex-amd64.tar.gz
