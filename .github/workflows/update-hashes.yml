name: Actualizar sha256.txt

# Workflow manual para verificar y registrar el hash de un nuevo release.
# Ejecutar con: Actions → "Actualizar sha256.txt" → Run workflow
# Requiere: GITHUB_TOKEN (automático), sin secretos adicionales.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Herramienta (opencode, ...)'
        required: true
        default: 'opencode'
      version:
        description: 'Versión (ej: 1.18.9)'
        required: true
      arch:
        description: 'Arquitectura (arm64, amd64)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - amd64

jobs:
  update-hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargar configuración de la herramienta
        id: conf
        run: |
          CONF="registry/${{ inputs.tool }}.conf"
          if [[ ! -f "$CONF" ]]; then
            echo "ERROR: No existe $CONF"; exit 1
          fi
          source "$CONF"
          echo "repo=$REPO"                     >> "$GITHUB_OUTPUT"
          echo "archive_template=$ARCHIVE_TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "checksum_algo=$CHECKSUM_ALGO"   >> "$GITHUB_OUTPUT"
          echo "attest_predicate=${ATTEST_PREDICATE:-}" >> "$GITHUB_OUTPUT"
          echo "arch_override_aarch64=${ARCH_OVERRIDE_AARCH64:-}" >> "$GITHUB_OUTPUT"
          echo "arch_override_x86_64=${ARCH_OVERRIDE_X86_64:-}" >> "$GITHUB_OUTPUT"

      - name: Construir URL y nombre del tarball
        id: url
        run: |
          TAG="v${{ inputs.version }}"
          INPUT_ARCH="${{ inputs.arch }}"
          ARCH="$INPUT_ARCH"
          case "$INPUT_ARCH" in
            arm64|aarch64)
              OVERRIDE="${{ steps.conf.outputs.arch_override_aarch64 }}"
              [[ -n "$OVERRIDE" ]] && ARCH="$OVERRIDE"
              ;;
            amd64|x86_64|x64)
              OVERRIDE="${{ steps.conf.outputs.arch_override_x86_64 }}"
              [[ -n "$OVERRIDE" ]] && ARCH="$OVERRIDE"
              ;;
          esac
          ARCHIVE="${{ steps.conf.outputs.archive_template }}"
          ARCHIVE="${ARCHIVE//\{VERSION\}/${{ inputs.version }}}"
          ARCHIVE="${ARCHIVE//\{ARCH\}/$ARCH}"
          ARCHIVE="${ARCHIVE//\{PLATFORM\}/linux_$ARCH}"
          URL="https://github.com/${{ steps.conf.outputs.repo }}/releases/download/$TAG/$ARCHIVE"
          echo "url=$URL"         >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      - name: Descargar tarball
        run: |
          curl -fL --proto '=https' --tlsv1.2 \
            -o "${{ steps.url.outputs.archive }}" \
            "${{ steps.url.outputs.url }}"

      - name: Calcular hash
        id: hash
        run: |
          ALGO="${{ steps.conf.outputs.checksum_algo }}"
          case "$ALGO" in
            sha256) H=$(sha256sum "${{ steps.url.outputs.archive }}" | cut -d' ' -f1) ;;
            sha512) H=$(sha512sum "${{ steps.url.outputs.archive }}" | cut -d' ' -f1) ;;
            *) echo "Algoritmo desconocido: $ALGO"; exit 1 ;;
          esac
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "Hash ($ALGO): $H"

      - name: Verificar attestation (si está configurada)
        if: steps.conf.outputs.attest_predicate != ''
        run: |
          gh release verify-asset \
            "${{ steps.url.outputs.tag }}" \
            "${{ steps.url.outputs.archive }}" \
            --repo "${{ steps.conf.outputs.repo }}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Actualizar sha256.txt
        run: |
          TOOL="${{ inputs.tool }}"
          TAG="${{ steps.url.outputs.tag }}"
          HASH="${{ steps.hash.outputs.hash }}"
          ARCH="${{ inputs.arch }}"

          if [[ "$ARCH" == "arm64" ]]; then
            KEY="$TOOL/$TAG"
          else
            KEY="$TOOL/$TAG:$ARCH"
          fi

          # Eliminar entrada previa si existe
          sed -i "\|^$KEY |d" sha256.txt

          # Agregar nueva entrada
          echo "$KEY  $HASH" >> sha256.txt
          echo "Entrada agregada: $KEY  $HASH"

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sha256.txt
          git commit -m "chore: agregar ${{ inputs.tool }}/${{ steps.url.outputs.tag }} (${{ inputs.arch }}) hash (${{ steps.conf.outputs.checksum_algo }})"
          git push
