name: Actualizar sha256.txt

# Workflow manual para verificar y registrar el hash de un nuevo release.
# Ejecutar con: Actions → "Actualizar sha256.txt" → Run workflow
# Requiere: GITHUB_TOKEN (automático), sin secretos adicionales.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: 'Herramienta (opencode, ...)'
        required: true
        default: 'opencode'
      version:
        description: 'Versión (ej: 1.18.9)'
        required: true
      arch:
        description: 'Arquitectura (arm64, amd64)'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - amd64

jobs:
  update-hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargar configuración de la herramienta
        id: conf
        env:
          INPUT_TOOL: ${{ inputs.tool }}
        run: |
          if [[ ! "${INPUT_TOOL}" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "ERROR: Nombre de herramienta inválido '${INPUT_TOOL}'"; exit 1
          fi
          CONF="registry/${INPUT_TOOL}.conf"
          if [[ ! -f "$CONF" ]]; then
            echo "ERROR: No existe $CONF"; exit 1
          fi
          source "$CONF"
          echo "repo=$REPO"                     >> "$GITHUB_OUTPUT"
          echo "archive_template=$ARCHIVE_TEMPLATE" >> "$GITHUB_OUTPUT"
          echo "checksum_algo=$CHECKSUM_ALGO"   >> "$GITHUB_OUTPUT"
          echo "attest_predicate=${ATTEST_PREDICATE:-}" >> "$GITHUB_OUTPUT"
          echo "arch_override_aarch64=${ARCH_OVERRIDE_AARCH64:-}" >> "$GITHUB_OUTPUT"
          echo "arch_override_x86_64=${ARCH_OVERRIDE_X86_64:-}" >> "$GITHUB_OUTPUT"

      - name: Construir URL y nombre del tarball
        id: url
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCH: ${{ inputs.arch }}
          REPO: ${{ steps.conf.outputs.repo }}
          ARCHIVE_TEMPLATE: ${{ steps.conf.outputs.archive_template }}
          ARCH_OVERRIDE_AARCH64: ${{ steps.conf.outputs.arch_override_aarch64 }}
          ARCH_OVERRIDE_X86_64: ${{ steps.conf.outputs.arch_override_x86_64 }}
        run: |
          TAG="v${INPUT_VERSION}"
          ARCH="$INPUT_ARCH"
          case "$INPUT_ARCH" in
            arm64|aarch64)
              [[ -n "$ARCH_OVERRIDE_AARCH64" ]] && ARCH="$ARCH_OVERRIDE_AARCH64"
              ;;
            amd64|x86_64|x64)
              [[ -n "$ARCH_OVERRIDE_X86_64" ]] && ARCH="$ARCH_OVERRIDE_X86_64"
              ;;
          esac
          ARCHIVE="$ARCHIVE_TEMPLATE"
          ARCHIVE="${ARCHIVE//\{VERSION\}/${INPUT_VERSION}}"
          ARCHIVE="${ARCHIVE//\{ARCH\}/${ARCH}}"
          ARCHIVE="${ARCHIVE//\{PLATFORM\}/linux_${ARCH}}"
          URL="https://github.com/${REPO}/releases/download/${TAG}/${ARCHIVE}"
          echo "url=$URL"         >> "$GITHUB_OUTPUT"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"

      - name: Descargar tarball
        env:
          URL: ${{ steps.url.outputs.url }}
          ARCHIVE: ${{ steps.url.outputs.archive }}
        run: |
          curl -fL --proto '=https' --tlsv1.2 \
            -o "$ARCHIVE" \
            "$URL"

      - name: Calcular hash
        id: hash
        env:
          ARCHIVE: ${{ steps.url.outputs.archive }}
          CHECKSUM_ALGO: ${{ steps.conf.outputs.checksum_algo }}
        run: |
          case "$CHECKSUM_ALGO" in
            sha256) H=$(sha256sum "$ARCHIVE" | cut -d' ' -f1) ;;
            sha512) H=$(sha512sum "$ARCHIVE" | cut -d' ' -f1) ;;
            *) echo "Algoritmo desconocido: $CHECKSUM_ALGO"; exit 1 ;;
          esac
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "Hash ($CHECKSUM_ALGO): $H"

      - name: Verificar attestation (si está configurada)
        if: steps.conf.outputs.attest_predicate != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.url.outputs.tag }}
          ARCHIVE: ${{ steps.url.outputs.archive }}
          REPO: ${{ steps.conf.outputs.repo }}
        run: |
          gh release verify-asset \
            "$TAG" \
            "$ARCHIVE" \
            --repo "$REPO"

      - name: Actualizar sha256.txt
        env:
          INPUT_TOOL: ${{ inputs.tool }}
          TAG: ${{ steps.url.outputs.tag }}
          HASH: ${{ steps.hash.outputs.hash }}
          INPUT_ARCH: ${{ inputs.arch }}
        run: |
          if [[ "$INPUT_ARCH" == "arm64" ]]; then
            KEY="${INPUT_TOOL}/${TAG}"
          else
            KEY="${INPUT_TOOL}/${TAG}:${INPUT_ARCH}"
          fi

          # Eliminar entrada previa si existe
          sed -i "\|^$KEY |d" sha256.txt

          # Agregar nueva entrada
          echo "$KEY  $HASH" >> sha256.txt
          echo "Entrada agregada: $KEY  $HASH"

      - name: Commit y push
        env:
          INPUT_TOOL: ${{ inputs.tool }}
          TAG: ${{ steps.url.outputs.tag }}
          INPUT_ARCH: ${{ inputs.arch }}
          CHECKSUM_ALGO: ${{ steps.conf.outputs.checksum_algo }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sha256.txt
          git commit -m "chore: agregar ${INPUT_TOOL}/${TAG} (${INPUT_ARCH}) hash (${CHECKSUM_ALGO})"
          git push
